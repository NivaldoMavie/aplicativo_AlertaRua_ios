workflows:
  ios-simulador:
    name: AlertaRua - Simulador
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Instalar XcodeGen
        script: brew install xcodegen
      - name: Gerar projecto Xcode
        script: xcodegen generate
      - name: Compilar para o simulador
        script: |
          xcodebuild \
            -project AlertaRua.xcodeproj \
            -scheme AlertaRua \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Criar zip do .app
        script: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r "$CM_BUILD_DIR/AlertaRua.zip" AlertaRua.app
    artifacts:
      - AlertaRua.zip
